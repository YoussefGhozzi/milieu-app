server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Sécurité : pas d'intégration dans un autre site, types stricts, pas de référent vers l'extérieur.
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

  location = /healthz { access_log off; return 200 "ok\n"; }

  # Fichiers versionnés (nom unique à chaque build) : cache long.
  location /_expo/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
  location /assets/ { expires 30d; try_files $uri =404; }

  # Application monopage : toutes les routes (ex. /pro/backoffice) servent index.html, jamais mis en cache.
  location / {
    add_header Cache-Control "no-cache" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri $uri.html /index.html;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
